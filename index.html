<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Viewer</title>
  <link rel="stylesheet" href="css/style.css?v=14">
</head>
<body>
  <header class="top">
    <div class="brand">Viewer</div>
    <input id="q" type="search" placeholder="作品、キャラ、タグを検索" autocomplete="off">
  </header>
  <div class="toolbar">
    <button type="button" class="sort is-on" data-sort="score">人気順</button>
    <button type="button" class="sort" data-sort="rating">評価順</button>
    <button type="button" class="sort" data-sort="new">新着</button>
    <button type="button" id="favs" class="sort">お気に入り</button>
    <button type="button" class="sort" data-panel="work">作品</button>
    <button type="button" class="sort" data-panel="character">キャラ</button>
    <button type="button" class="sort" data-panel="tag">タグ</button>
  </div>
  <div id="picked" class="picked"></div>
  <section id="panel" class="panel" hidden>
    <input id="panel-q" type="search" placeholder="棚の中を絞り込む" autocomplete="off">
    <div id="panel-list" class="panel-list"></div>
  </section>
  <main>
    <p id="count" class="count"></p>
    <div id="grid" class="grid"></div>
    <p id="empty" class="empty" hidden>該当する作品がありません。</p>
  </main>
  <div id="modal" class="modal" hidden>
    <button type="button" id="close" class="close" aria-label="閉じる">×</button>
    <div class="watch">
      <div id="stage" class="stage"></div>
      <div class="meta">
        <h1 id="title"></h1>
        <p id="sub"></p>
        <button type="button" id="fav" class="sort">お気に入り</button>
        <button type="button" id="loop" class="sort is-on">ループ</button>
        <a id="origin" href="#" target="_blank" rel="noreferrer">元のページで開く</a>
        <div id="tagbox"></div>
      </div>
    </div>
    <button type="button" id="close-bar" class="close-bar">閉じる</button>
  </div>
  <script src="js/app.js?v=14"></script>
</body>
</html>
