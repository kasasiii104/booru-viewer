<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ビューアー</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div class="brand">Viewer</div>
    <input id="q" type="search" placeholder="作品、キャラ、タグ" autocomplete="off">
    <div class="sorts">
      <button type="button" class="sort is-on" data-sort="score">人気順</button>
      <button type="button" class="sort" data-sort="new">新着</button>
    </div>
  </header>
  <div class="layout">
    <nav id="works" class="side"></nav>
    <main>
      <div id="chips" class="chips"></div>
      <p id="count" class="count"></p>
      <div id="grid" class="grid"></div>
      <p id="empty" class="empty" hidden>該当する作品がありません。取得スクリプトを回すと一覧が増えます。</p>
    </main>
  </div>
  <div id="modal" class="modal" hidden>
    <div class="sheet">
      <button type="button" id="close" class="close">閉じる</button>
      <div id="stage"></div>
      <div class="meta">
        <h1 id="title"></h1>
        <p id="sub"></p>
        <a id="origin" href="#" target="_blank" rel="noreferrer">元のページで開く</a>
      </div>
    </div>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
